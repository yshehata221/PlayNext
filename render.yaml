# Deployment on Render: an API and a static frontend.
#
# The database is deliberately NOT defined here. Render's free Postgres is
# deleted 30 days after creation, which would quietly break a demo linked from
# a CV. Use a provider whose free tier persists (Neon, Supabase) and paste the
# connection string into DATABASE_URL in the dashboard - the app rewrites the
# URL for its driver, so it can be pasted verbatim.
services:
  - type: web
    name: playnext-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # paste from Neon/Supabase; marked sync:false so it never enters the repo
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: playnext-web
          type: web
          property: hostport
      - key: PUBLIC_API_URL
        fromService:
          name: playnext-api
          type: web
          property: hostport
      - key: FRONTEND_URL
        fromService:
          name: playnext-web
          type: web
          property: hostport
      # optional integrations - add in the dashboard if you have the keys
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: STEAM_API_KEY
        sync: false

  # Static sites on Render are always on and have no cold start, so the app
  # itself loads instantly even while the API is waking up.
  - type: web
    name: playnext-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: playnext-api
          type: web
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
