# Publishes the frontend to GitHub Pages on every push to main.
#
# Pages serves static files only, so this always builds the *demo* build: every
# API call is answered from a captured snapshot inside the browser. No backend,
# no hosting bill, no cold start, and nothing that can break later.
#
# Only one repository setting is needed:
#   Settings > Pages > Source: GitHub Actions
#
# To point Pages at a live API instead, set USE_REAL_API and API_URL as
# repository variables (Settings > Secrets and variables > Actions > Variables).
# Demo mode stays on unless USE_REAL_API is exactly "true", so a stray API_URL
# can't silently produce a build with no working backend behind it.
name: Deploy frontend to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a queued deploy replaces an in-progress one rather than racing it
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

      - name: Build
        env:
          # a project site is served from /<repo>/, so assets need that prefix
          BASE_PATH: /${{ github.event.repository.name }}/
          # both are inlined into the bundle at build time
          VITE_API_URL: ${{ vars.USE_REAL_API == 'true' && vars.API_URL || '' }}
          VITE_DEMO_MODE: ${{ vars.USE_REAL_API == 'true' && '0' || '1' }}
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a deep link like /library would 404.
        # Copying index.html to 404.html makes Pages serve the app instead and
        # lets the router take over.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
